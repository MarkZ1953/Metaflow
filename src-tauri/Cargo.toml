[package]
name = "metaflow"
version = "0.5.2"
description = "Local Inbox organization with date rules and safe Undo"
authors = ["Metaflow"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "metaflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
infer = "0.22"
mime_guess = "2"
dunce = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
notify = "8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
blake3 = "1"
unicode-normalization = "0.1.25"
serde_json = "1"
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "ico"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-24"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security"] }
windows = { version = "0.62.2", features = ["Foundation", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Win32_System_WinRT"] }

[dev-dependencies]
tempfile = "3"
